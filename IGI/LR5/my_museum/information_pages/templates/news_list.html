<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новости музея</title>
</head>
<body>

<h1>Новости музея</h1>

<div>
    {% if all_news %}
        {% for news in all_news %}
            <div>
                <h2>{{ news.title }}</h2>
                <p><em>{{ news.short_description }}</em></p>
                {% if news.image %}
                    <img src="{{ news.image.url }}" alt="Изображение новости">
                {% endif %}
                <p>{{ news.content }}</p>
                <p><small>Опубликовано: {{ news.published_at|date:"d.m.Y H:i" }}</small></p>
                <hr>
            </div>
        {% endfor %}
    {% else %}
        <p>Новостей пока нет.</p>
    {% endif %}
</div>

<p><a href="{% url 'main' %}">← Назад на главную</a></p>

</body>
</html>
