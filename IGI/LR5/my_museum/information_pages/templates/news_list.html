<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Новости музея</title>
    <style>
        body {
            background-color: #f7f3ef;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px 100px;
        }

        h1 {
            font-size: 32px;
            font-weight: bold;
            color: brown;
            text-shadow: 2px 2px 0px black;
            margin-bottom: 40px;
        }

        .news-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .news-item {
            background-color: white;
            border: 2px solid #8B4513;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.2);
            text-align: left;
        }

        .news-item h2 {
            color: #8B0000;
            margin-bottom: 10px;
        }

        .news-item p.short-description {
            font-style: italic;
            color: #555;
            margin-bottom: 10px;
        }

        .news-item img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .news-item p.content {
            color: #333;
        }

        .published-date {
            font-size: 0.85em;
            color: gray;
            margin-top: 10px;
            text-align: right;
        }
    </style>
</head>
<body>

    <h1>Новости музея</h1>

    <div class="news-container">
        {% if all_news %}
            {% for news in all_news %}
                <div class="news-item">
                    <h2>{{ news.title }}</h2>
                    <p class="short-description">{{ news.short_description }}</p>
                    {% if news.image %}
                        <img src="{{ news.image.url }}" alt="Изображение новости">
                    {% endif %}
                    <p class="content">{{ news.content }}</p>
                    <div class="published-date">Опубликовано: {{ news.published_at|date:"d.m.Y H:i" }}</div>
                </div>
            {% endfor %}
        {% else %}
            <p>Новостей пока нет.</p>
        {% endif %}
    </div>

    <a href="{% url 'main' %}">← Назад на главную</a>

</body>
</html>
