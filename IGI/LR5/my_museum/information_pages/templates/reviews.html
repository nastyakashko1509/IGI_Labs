<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Отзывы посетителей</title>
    <style>
        body {
            background-color: #f7f3ef;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px 100px;
        }

        h1 {
            font-size: 32px;
            font-weight: bold;
            color: brown;
            text-shadow: 2px 2px 0px black;
            margin-bottom: 40px;
        }

        .review-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .review-item {
            background-color: white;
            border: 2px solid #8B4513;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.2);
            text-align: left;
        }

        .review-item h3 {
            color: #8B0000;
            margin-bottom: 10px;
        }

        .review-item p {
            color: #333;
        }

        .review-form {
            background-color: #fff8f0;
            border: 2px dashed #8B4513;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 40px;
        }

        .review-form input[type="text"],
        .review-form textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .review-form input[type="submit"] {
            background-color: #8B0000;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }

        .review-form input[type="submit"]:hover {
            background-color: #a80000;
        }

        .rating-group label {
            margin-right: 10px;
            font-weight: bold;
        }

        .rating-group input {
            margin-right: 3px;
        }

        .rating-display {
            font-style: italic;
            color: #555;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h1>Отзывы посетителей</h1>

    <div class="review-container">

        <form method="post" class="review-form">
            {% csrf_token %}
            <input type="text" name="user" placeholder="Ваше имя (необязательно)">
            <textarea name="text" placeholder="Ваш отзыв..." rows="4" required></textarea>

            <div class="rating-group">
                <label>Оценка:</label>
                <label><input type="radio" name="rating" value="1" required>1</label>
                <label><input type="radio" name="rating" value="2">2</label>
                <label><input type="radio" name="rating" value="3">3</label>
                <label><input type="radio" name="rating" value="4">4</label>
                <label><input type="radio" name="rating" value="5">5</label>
            </div>

            <input type="submit" value="Отправить">
        </form>

        {% if reviews %}
            {% for review in reviews %}
                <div class="review-item">
                    <h3>{{ review.author.username }}</h3>
                    <p>{{ review.text }}</p>
                    <div class="rating-display">Оценка: {{ review.rating }}/5</div>
                </div>
            {% endfor %}
        {% else %}
            <p>Пока нет ни одного отзыва.</p>
        {% endif %}
    </div>

    <a href="{% url 'main' %}">← Назад на главную</a>

</body>
</html>
