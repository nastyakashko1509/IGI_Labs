<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <style>
        body {
            background-color: #f7f3ef;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 60px;
        }

        h1 {
            font-size: 32px;
            font-weight: bold;
            color: brown;
            text-shadow: 2px 2px 0px black;
            margin-bottom: 40px;
        }

        .button-container {
            margin-top: 30px;
        }

        .button-container a {
            display: inline-block;
            text-decoration: none;
            background-color: #8B4513;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        .button-container a:hover {
            background-color: #A0522D;
        }

        .message-list {
            list-style: none;
            padding: 0;
            margin-bottom: 20px;
        }

        .message-list li {
            background-color: #e6c5a1;
            color: #4b2e1e;
            padding: 10px;
            border: 1px solid #8B4513;
            border-radius: 5px;
            margin: 5px auto;
            max-width: 600px;
        }

        form {
            display: inline-block;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            border: 2px solid #8B4513;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 90%;
            text-align: left;
        }

        form p {
            margin-bottom: 15px;
        }

        form label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #4b2e1e;
        }

        form input[type="text"],
        form input[type="email"],
        form input[type="date"],
        form select,
        form textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        form input[type="file"] {
            margin-top: 5px;
        }

        button[type="submit"] {
            background-color: #8B4513;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        button[type="submit"]:hover {
            background-color: #A0522D;
        }
    </style>
</head>
<body>
    <h1>{{ title }}</h1>

    {% if messages %}
        <ul class="message-list">
            {% for message in messages %}
                <li>{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Сохранить</button>
    </form>

    <div class="button-container">
        <a href="{% url 'employee_list' %}">← Назад к списку</a>
    </div>
</body>
</html>
