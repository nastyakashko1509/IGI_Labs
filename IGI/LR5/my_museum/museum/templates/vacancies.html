<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вакансии музея</title>
    <style>
        body {
            background-color: #f7f3ef;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px 20px 100px;
        }

        h1 {
            font-size: 32px;
            font-weight: bold;
            color: brown;
            text-shadow: 2px 2px 0px black;
            margin-bottom: 40px;
        }

        .vacancies-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .vacancy-item {
            background-color: white;
            border: 2px solid #8B4513;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 3px 3px 10px rgba(0,0,0,0.2);
            text-align: left;
        }

        .vacancy-item h2 {
            color: #8B0000;
            margin-bottom: 10px;
        }

        .vacancy-item p.description {
            color: #333;
        }
    </style>
</head>
<body>

    <h1>Вакансии музея</h1>

    <div class="vacancies-container">
        {% if positions %}
            {% for position in positions %}
                <div class="vacancy-item">
                    <h2>{{ position.title }}</h2>
                    <p class="description">{{ position.description|linebreaks }}</p>
                </div>
            {% endfor %}
        {% else %}
            <p>Вакансий пока нет.</p>
        {% endif %}
    </div>

    <a href="{% url 'main' %}">← Назад на главную</a>

</body>
</html>
